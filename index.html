<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teatime</title>
<meta name="theme-color" content="#0f8b8d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teatime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout idea: a teatime game board. A winding path of topic stops, chunky
   pressable buttons, a teacup mascot; English is always teal. */
:root{
  --bg:#eef3f8;--card:#ffffff;--ink:#1b2545;--muted:#56607d;--line:#d8e0ec;
  --pri:#0f8b8d;--pri2:#0a6466;--tint:#dcf2f1;
  --berry:#e0457b;--berry2:#b02e5d;--sun:#ffc93c;--sun2:#d39a12;--sky:#2f6fd6;--sky2:#1f50a3;--plum:#7a4fd6;--plum2:#5a35a8;
  --ok:#1e9b57;--ok2:#147a42;--okbg:#e0f5e8;--bad:#d64545;--bad2:#a83232;--badbg:#fde7e7;
  --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",Roboto,Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;padding-bottom:calc(5.2rem + env(safe-area-inset-bottom))}
body.focus{padding-bottom:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0}
.en{color:var(--pri2)}
.muted{color:var(--muted)}.small{font-size:.86rem}
.wrap{max-width:34rem;margin:0 auto;padding:0 1rem}
main{display:flex;flex-direction:column;gap:1.2rem;padding-top:.6rem;padding-bottom:1.5rem}
main.act{padding-top:calc(.6rem + env(safe-area-inset-top));padding-bottom:10rem;min-height:100vh}
section{display:flex;flex-direction:column;gap:.75rem}
.row{display:flex;align-items:center;gap:.6rem}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-top:.6rem;padding-bottom:.4rem}
.logo{display:flex;align-items:center;gap:.4rem;font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--pri2)}
.chips{display:flex;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--display);font-weight:600;font-size:.95rem;padding:.25rem .65rem;border-radius:99px;background:var(--card);border:2px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.fire{color:#d9541e}.chip.star{color:var(--sun2)}
.chip.ok{color:var(--ok2);border-color:var(--ok)}.chip.lock{color:var(--muted)}
.chip.due{color:var(--berry2);border-color:var(--berry)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.3rem;padding:.6rem 1.1rem;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:1.1rem;text-align:center;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2)}
.btn.berry{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad2)}
.btn.block{width:100%}
.btn.link{border:0;background:none;box-shadow:none;min-height:2.4rem;padding:.2rem;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.95rem;text-decoration:underline}
.btn.link:active{transform:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.spk{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--pri);background:var(--card);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--pri2);vertical-align:middle}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri2)}
.spk svg{width:1.2rem;height:1.2rem}
.spk.huge{width:6rem;height:6rem;box-shadow:0 6px 0 var(--pri2);background:var(--pri);color:#fff}
.spk.huge svg{width:2.6rem;height:2.6rem}

/* cards */
.card{background:var(--card);border-radius:22px;padding:1.1rem;border:2px solid var(--line)}
.hello{display:flex;gap:.8rem;align-items:flex-end}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.bubble::after{content:"";position:absolute;left:-11px;bottom:22px;width:18px;height:18px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .big{font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--pri2)}
.tag{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--berry2)}
.goal{display:flex;gap:1rem;align-items:center}
.ring{flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .5s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;text-align:center;font-size:.75rem;color:var(--muted)}
.week b{display:block;width:1.45rem;height:1.45rem;margin:0 auto .15rem;border-radius:50%;border:2px solid var(--line);line-height:1.2rem;font-size:.8rem}
.week .part b{border-color:var(--sun);background:#fff3cf}
.week .full b{border-color:var(--sun2);background:var(--sun)}
.week .now{color:var(--ink);font-weight:700}
.banner{display:flex;gap:.8rem;align-items:center;background:var(--ink);color:#fff;border-radius:18px;padding:.9rem 1rem}
.banner .btn.link{color:#c9d3ea}

/* path */
.lvl{border-radius:20px;padding:.9rem 1.1rem;color:#fff;display:flex;flex-direction:column;gap:.2rem;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.lvl.l1{background:var(--pri)}.lvl.l2{background:var(--sky)}.lvl.l3{background:var(--berry)}.lvl.l4{background:var(--plum)}
.lvl.l5{background:#e8772e}.lvl.l6{background:var(--ink)}.lvl.l7{background:#13795b}
.lvl.locked{background:#9aa5ba}
.lvl small{opacity:.92}
.path{display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding:1.6rem 0 .8rem}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;transform:translateX(var(--x))}
.disc{width:5.1rem;height:5.1rem;border-radius:50%;border:0;font-size:2.2rem;line-height:1;background:var(--card);box-shadow:inset 0 0 0 4px var(--pri),0 6px 0 var(--pri2);display:flex;align-items:center;justify-content:center}
.disc:active{transform:translateY(4px);box-shadow:inset 0 0 0 4px var(--pri),0 2px 0 var(--pri2)}
.disc.cur{background:var(--pri);box-shadow:0 6px 0 var(--pri2),0 0 0 7px rgba(15,139,141,.22)}
.disc.done{background:var(--sun);box-shadow:0 6px 0 var(--sun2)}
.disc.lock{background:#e3e8f0;box-shadow:0 6px 0 #c6cfdd;filter:grayscale(1);opacity:.75;cursor:default}
.disc.lock:active{transform:none}
.stars{font-size:1rem;letter-spacing:.08em;color:#c6cfdd;line-height:1}
.stars i{font-style:normal;color:var(--sun2)}
.nlabel{font-size:.85rem;font-weight:700;text-align:center;max-width:9.5rem;line-height:1.2}
.go{position:absolute;top:-2.2rem;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:.9rem;padding:.2rem .7rem;border-radius:10px;white-space:nowrap}
.go::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}

/* tiles & lists */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tile{border:0;border-radius:22px;padding:1rem;color:#fff;min-height:9rem;display:flex;flex-direction:column;justify-content:space-between;text-align:left;gap:.4rem}
.tile:active{transform:translateY(4px)}
.tile .em{font-size:2.1rem;line-height:1}
.tile strong{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.1}
.tile span{font-size:.85rem;opacity:.95}
.tile.t1{background:var(--berry);box-shadow:0 6px 0 var(--berry2)}
.tile.t2{background:var(--sky);box-shadow:0 6px 0 var(--sky2)}
.tile.t3{background:var(--plum);box-shadow:0 6px 0 var(--plum2)}
.tile.t4{background:var(--pri);box-shadow:0 6px 0 var(--pri2)}
.tile.wide{grid-column:1/-1;min-height:6.5rem;flex-direction:row;align-items:center;justify-content:flex-start;gap:1rem}
.list{display:flex;flex-direction:column;gap:.7rem}
.item{display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.8rem 1rem;box-shadow:0 4px 0 var(--line)}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.item[disabled]{opacity:.55;cursor:default}
.item[disabled]:active{transform:none;box-shadow:0 4px 0 var(--line)}
.item .em{flex:none;font-size:1.8rem;width:2.4rem;text-align:center}
.item .meta{font-size:.82rem;color:var(--muted)}
.subhead{font-family:var(--display);font-weight:600;color:var(--muted);font-size:1rem;margin-top:.4rem}

/* activity */
.actbar{display:flex;align-items:center;gap:.7rem}
.x{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:transparent;font-size:1.4rem;color:var(--muted)}
.bar{flex:1;height:1rem;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .3s}
.bar.sun i{background:var(--sun)}
.bar.thin{height:.55rem;flex:none;width:100%}
.prompt{font-family:var(--display);font-weight:600;font-size:1.35rem}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:1.3rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.qcard.center{align-items:center;text-align:center}
.word{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1.1;color:var(--pri2);overflow-wrap:anywhere}
.de{font-size:1.25rem;font-weight:700}
.hr{align-self:stretch;height:2px;background:var(--line);margin:.4rem 0}
.opts{display:flex;flex-direction:column;gap:.65rem}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;min-height:3.4rem;text-align:left;padding:.6rem 1rem;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.1rem}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.en{font-weight:700}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok2);box-shadow:0 4px 0 var(--ok);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad2);box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:active{transform:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toks{display:flex;flex-wrap:wrap;gap:.5rem;min-height:3.2rem;align-items:center}
.toks.ans{border-bottom:2px solid var(--line);padding-bottom:.6rem}
.tok{min-height:2.8rem;padding:.3rem .85rem;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:700;color:var(--pri2)}
.tok.used{visibility:hidden}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:1rem 0 calc(1rem + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line)}
.foot .wrap{display:flex;flex-direction:column;gap:.6rem}
.foot.ok{background:var(--okbg);border-color:var(--ok)}
.foot.no{background:var(--badbg);border-color:var(--bad)}
.verdict{font-family:var(--display);font-weight:600;font-size:1.3rem}
.foot.ok .verdict{color:var(--ok2)}.foot.no .verdict{color:var(--bad2)}
.combo{font-family:var(--display);font-weight:700;color:#d9541e;white-space:nowrap}
.endv{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding-top:1.5rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:100%}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.75rem .5rem;text-align:center}
.stats strong{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted)}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.pc{min-height:3.8rem;padding:.4rem .6rem;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.02rem;transition:opacity .25s}
.pc.l{font-weight:700;color:var(--pri2)}
.pc.sel{border-color:var(--sky);background:#e3edfc;box-shadow:0 4px 0 var(--sky)}
.pc.bad{border-color:var(--bad);background:var(--badbg);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.pc.gone{opacity:0;pointer-events:none}

/* reading & chat */
.sent{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:0}
.sent .t{flex:1;background:none;border:0;padding:.2rem 0;text-align:left;color:var(--pri2);font-size:1.15rem}
.sent.now .t{background:var(--tint);border-radius:8px}
.sent .tr{display:block;color:var(--ink);font-size:.95rem;margin-top:.15rem}
.qblock{display:flex;flex-direction:column;gap:.5rem}
.chat{display:flex;flex-direction:column;gap:.7rem}
.msg{max-width:88%;padding:.7rem .9rem;border-radius:18px;display:flex;flex-direction:column;gap:.3rem}
.msg.npc{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.npc .line{display:flex;gap:.5rem;align-items:flex-start;color:var(--pri2);font-size:1.12rem;font-weight:700}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px;font-size:1.08rem}
.msg.me .sub{font-size:.85rem;opacity:.9}
.gapbox{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--pri);color:var(--pri2);font-weight:700;text-align:center}
.rule{display:flex;flex-direction:column;gap:.55rem;font-size:1.05rem}
.rule b{color:var(--pri2)}
.wt{display:flex;flex-wrap:wrap;align-items:baseline;gap:.1rem .15rem;line-height:1.3}
.w{border:0;background:none;padding:.18rem .28rem;border-radius:9px;font-size:1.22rem;font-weight:600;color:var(--pri2);font-family:var(--body)}
.w.f{background:var(--berry);color:#fff;font-size:1.05rem}
.w:active{background:var(--tint)}
.p{font-size:1.2rem;color:var(--muted)}
.tk{display:inline-flex;align-items:baseline}
.tk .w+.p{margin-left:-.25rem}
.wsent{display:flex;flex-direction:column;gap:.35rem;padding:.7rem 0;border-bottom:1px dashed var(--line)}
.wsent:last-child{border-bottom:0}
.wtools{display:flex;gap:.5rem;align-items:center}
@media (prefers-reduced-motion:no-preference){.w.f{animation:flip .25s ease-out}@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}}
.marks .hit{color:var(--ok2);font-weight:700}.marks .gap{color:var(--bad2);text-decoration:underline}
.msg.me .marks{background:#fff;border-radius:10px;padding:.3rem .5rem;color:var(--ink)}
.mic{width:6rem;height:6rem;border-radius:50%;border:0;background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry2);display:inline-flex;align-items:center;justify-content:center}
.mic svg{width:2.6rem;height:2.6rem}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--berry2),0 0 0 14px rgba(224,69,123,.25)}}
.say{display:flex;gap:.5rem}
.say input{flex:1;min-width:0;min-height:3.3rem;border:2px solid var(--line);border-radius:16px;padding:.5rem .9rem;background:var(--card);color:var(--pri2)}
.center{align-items:center;text-align:center}

/* profile */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.badge{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.75rem .4rem;text-align:center;display:flex;flex-direction:column;gap:.2rem;align-items:center}
.badge .em{font-size:2rem;line-height:1.1}
.badge strong{font-size:.82rem;line-height:1.15}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.2}
.badge.off .em{filter:grayscale(1);opacity:.35}
.badge.off strong{color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:.5rem .75rem;min-height:2.7rem;font-size:.9rem}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--pri);color:#fff;font-weight:700}
.setting{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body.focus #nav{display:none}
#nav .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding:0 .1rem}
#nav a{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem 0 .55rem;color:var(--muted);text-decoration:none;font-size:.64rem;font-weight:700}
#nav a svg{width:1.6rem;height:1.6rem}
#nav a[aria-current="page"]{color:var(--pri)}
#nav a[aria-current="page"] svg{background:var(--tint);border-radius:10px;padding:.1rem;box-sizing:content-box;margin:-.1rem}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + .8rem);transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;border-radius:16px;padding:.7rem 1.1rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 2rem);text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:no-preference){.toast{animation:drop .3s ease-out}@keyframes drop{from{transform:translate(-50%,-120%)}}.go{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}
@media (prefers-reduced-motion:reduce){.mic.on,.shake,.pc.bad{animation:none}}
@media (max-width:370px){html{font-size:16.5px}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Bereiche"><div class="wrap">
  <a href="#start" data-tab="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Start</a>
  <a href="#ueben" data-tab="ueben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17.5 13.5h.01"/></svg>Spielen</a>
  <a href="#lesen" data-tab="lesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>Lesen</a>
  <a href="#grammatik" data-tab="grammatik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l4.5-12L12 18M4.7 14h5.6"/><path d="M17.5 18v-5.5a2.5 2.5 0 0 0-5 0M17.5 14.5h-2.3a2 2 0 0 0 0 4c1.3 0 2.3-1 2.3-2.3"/></svg>Grammatik</a>

<script>
"use strict";
/* ================= Daten ================= */
const C=window.CONTENT||{topics:[],texts:[],dialogs:[],grammar:[]},T=C.topics,R=C.texts,D=C.dialogs,G=C.grammar||[],WT=C.wtexts||[],LEX=C.lex||{};
const LN=["","Einsteiger","Grundlagen","Aufbau","Fortgeschritten","Mittelstufe","Profi","Experte"],MAXLV=7,INT=[0,1,2,4,8,16];
const ALL=[];T.forEach((t,ti)=>t.w.forEach((_,wi)=>ALL.push(ti+"."+wi)));
const W=id=>{const p=id.split(".");return T[+p[0]].w[+p[1]]};
const tOf=id=>+id.split(".")[0];
const lvOf=id=>T[tOf(id)].lv;
const KEY="teatime.v1";
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function def(){return{cards:{},xp:0,streak:0,best:0,last:0,days:{},goal:60,rate:.85,accent:"en-GB",sound:true,read:{},dlg:{},level:1,hist:[],badges:{},bestCombo:0,blitz:0,pairs:0,perfect:false,noInstall:false,goalDay:0,reps:0,placed:false,gram:{},wread:{},srOff:false}}
function load(){let s=def();try{const r=localStorage.getItem(KEY);if(r)s=Object.assign(s,JSON.parse(r))}catch(e){}
  const t=today();for(const k in s.days)if(+k<t-60)delete s.days[k];return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const ui={act:null,listening:false,rec:null,srOff:false,timer:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const card=id=>S.cards[id]||{box:0,due:0};
const seen=id=>card(id).box>=1;
const isDue=id=>seen(id)&&card(id).due<=today();
const learnedPool=min=>{const s=ALL.filter(seen);return s.length>=min?s:T[0].w.map((_,i)=>"0."+i).concat(s.length?s:[])};

/* ================= Klang, Sprache, Effekte ================= */
let ac=null;
function beep(kind){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  const seq=kind==="ok"?[[660,0],[990,.09]]:kind==="bad"?[[200,0],[160,.13]]:[[523,0],[659,.12],[784,.24],[1047,.36]];
  seq.forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain(),at=ac.currentTime+t;o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(kind==="bad"?.12:.16,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.25);
    o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+.28)})}catch(e){}}
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){try{voices=synth.getVoices()||[]}catch(e){voices=[]}}
if(synth){loadVoices();try{synth.addEventListener("voiceschanged",loadVoices)}catch(e){}}
const canSpeak=()=>!!synth;
function voice(){const n=v=>(v.lang||"").replace("_","-");const m=voices.filter(v=>n(v)===S.accent);
  return m.find(v=>/premium|enhanced|natural/i.test(v.name))||m[0]||voices.find(v=>n(v).indexOf("en")===0)||null}
let curU=null,unlockedTTS=false;
const AUD=new Audio();AUD.preload="auto";let AMAN=null;
fetch("audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j)AMAN={gb:new Set(j.gb||[]),us:new Set(j.us||[])}}).catch(()=>{});
function fnv(t){let h=0x811c9dc5;for(const b of new TextEncoder().encode(t)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
const audioCount=()=>AMAN?AMAN[S.accent==="en-US"?"us":"gb"].size:0;
function speak(text,done){const t=String(text).replace(/_/g," ").replace(/\s+/g," ").trim(),acc=S.accent==="en-US"?"us":"gb",k=fnv(t);
  if(AMAN&&AMAN[acc].has(k)){try{if(synth)synth.cancel()}catch(e){}curU=null;AUD.pause();let fin=false;
    const ok=()=>{if(fin)return;fin=true;AUD.onended=AUD.onerror=null;if(done)done()};
    const bad=()=>{if(fin)return;fin=true;AUD.onended=AUD.onerror=null;speakSynth(t,done)};
    AUD.onended=ok;AUD.onerror=bad;AUD.src="audio/"+acc+"/"+k+".mp3";AUD.playbackRate=S.rate/.85;
    try{const p=AUD.play();if(p&&p.catch)p.catch(bad)}catch(e){bad()}return}
  speakSynth(t,done)}
function speakSynth(text,done){const end=()=>{if(done)done()};if(!synth){end();return}
  try{if(!voices.length)loadVoices();const u=new SpeechSynthesisUtterance(text);const v=voice();if(v)u.voice=v;u.lang=v?v.lang:S.accent;u.rate=S.rate;u.volume=1;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(wd);if(curU===u)curU=null;end()};u.onend=f;u.onerror=f;curU=u;
    const wd=setTimeout(f,2500+text.split(" ").length*700/S.rate);
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{if(curU===u)synth.speak(u)},120)}else synth.speak(u);
    if(synth.paused)synth.resume()}catch(e){end()}}
function unlockTTS(){if(unlockedTTS||!synth)return;unlockedTTS=true;loadVoices();try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}catch(e){}}
document.addEventListener("touchend",unlockTTS,{passive:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&synth){try{synth.cancel()}catch(e){}curU=null}});document.addEventListener("click",unlockTTS,true);
function hush(){curU=null;try{AUD.onended=AUD.onerror=null;AUD.pause()}catch(e){}try{if(synth)synth.cancel()}catch(e){}stopRec(true);}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const spk=t=>canSpeak()?`<button class="spk" data-a="say" data-s="${esc(t)}" aria-label="Vorlesen">${SPK}</button>`:"";

/* Spracherkennung (im Browser eingebaut) */
const hasSR=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)&&!S.srOff;
const KBTIP=`<p class="small muted">Tipp: Damit das iPhone dein Englisch richtig aufschreibt, unter Einstellungen → Allgemein → Tastatur → Tastaturen eine <b>englische Tastatur</b> hinzufügen. Beim Sprechen dann mit der 🌐-Taste auf Englisch wechseln und auf das Mikrofon der Tastatur tippen.</p>`;
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","20":"twenty","40":"forty","50":"fifty"};
const CONTR={"it's":"it is","i'm":"i am","don't":"do not","isn't":"is not","can't":"cannot","i'll":"i will","that's":"that is","what's":"what is","let's":"let us","you're":"you are","we're":"we are","they're":"they are","doesn't":"does not","didn't":"did not","i've":"i have","won't":"will not","there's":"there is","where's":"where is","i'd":"i would","he's":"he is","she's":"she is","aren't":"are not","wasn't":"was not"};
function words(x){return x.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean).map(w=>CONTR[w]||NUM[w]||w).join(" ").split(" ").filter(Boolean)}
function compare(target,heard){const said=words(heard);const marks=target.split(" ").map(tk=>{const ws=words(tk);if(!ws.length)return[tk,true];let ok=true;ws.forEach(w=>{const i=said.indexOf(w);if(i>=0)said.splice(i,1);else ok=false});return[tk,ok]});
  return{marks,score:marks.filter(m=>m[1]).length/marks.length,heard}}
function listen(target,cb){if(ui.listening){stopRec(false);return}if(ui.thinking)return;if(!hasSR()){cb(null);return}
  try{if(synth)synth.cancel()}catch(e){}try{AUD.pause()}catch(e){}
  loadSTT().catch(()=>{});
  navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}}).then(st=>{
    const mt=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||"";
    const mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined),ch=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    const rec={mr,st,ch,mt,target,cb,cancel:false};ui.rec=rec;ui.listening=true;
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(rec.to);ui.listening=false;if(rec.cancel){render();return}ui.thinking=true;render();
      transcribe(new Blob(ch,{type:mt||"audio/mp4"})).then(text=>{ui.thinking=false;if(!text){toast("Ich habe nichts verstanden. Sprich etwas lauter und deutlicher.");render();return}cb(compare(target,text))})
        .catch(e=>{ui.thinking=false;console.warn(e);toast(sttState==="error"?"Die Spracherkennung konnte nicht geladen werden. Prüfe die Internetverbindung.":"Die Aufnahme konnte nicht ausgewertet werden.");render()})};
    mr.start();rec.to=setTimeout(()=>stopRec(false),12000);render()
  }).catch(e=>{console.warn(e);S.srOff=true;save();toast("Das Mikrofon ist nicht erlaubt. Erlaube es in den iPhone-Einstellungen oder nutze das Textfeld.");render()})}
function stopRec(cancel){const r=ui.rec;if(!r)return;ui.rec=null;r.cancel=!!cancel;try{if(r.mr.state!=="inactive")r.mr.stop();else{r.st.getTracks().forEach(t=>t.stop());ui.listening=false}}catch(e){ui.listening=false}}
/* Whisper (läuft komplett auf dem Handy) */
let sttPipe=null,sttLoading=null,sttState="idle",sttPct=0;const sttFiles={};
function loadSTT(){if(sttPipe)return Promise.resolve(sttPipe);if(sttLoading)return sttLoading;sttState="loading";
  sttLoading=import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2").then(T=>{T.env.allowLocalModels=false;
    return T.pipeline("automatic-speech-recognition","Xenova/whisper-base.en",{dtype:"q8",device:"wasm",progress_callback:p=>{
      if(p.status==="progress"&&p.total){sttFiles[p.file]=[p.loaded,p.total];let a=0,b=0;for(const k in sttFiles){a+=sttFiles[k][0];b+=sttFiles[k][1]}
        const pct=Math.floor(a/b*100);if(pct!==sttPct){sttPct=pct;const el=document.getElementById("sttp");if(el)el.textContent="Spracherkennung wird geladen … "+pct+" %";}}}})})
    .then(p=>{sttPipe=p;sttState="ready";const el=document.getElementById("sttp");if(el)el.textContent="";return p})
    .catch(e=>{sttLoading=null;sttState="error";throw e});return sttLoading}
async function transcribe(blob){const ab=await blob.arrayBuffer();const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
  const buf=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});try{ctx.close()}catch(e){}
  if(buf.duration<.3)return "";const len=Math.ceil(buf.duration*16000),off=new OfflineAudioContext(1,len,16000),src=off.createBufferSource();
  src.buffer=buf;src.connect(off.destination);src.start();const r=await off.startRendering(),data=r.getChannelData(0);
  let peak=0;for(let i=0;i<data.length;i+=8)peak=Math.max(peak,Math.abs(data[i]));if(peak<.01)return "";
  const pipe=await loadSTT();const out=await pipe(data);return String((out&&out.text)||"").replace(/\[[^\]]*\]|\([^)]*\)/g," ").trim()}
const sttNote=()=>ui.listening?"🔴 Ich höre zu … Tippe nochmal, wenn du fertig bist.":ui.thinking?(sttState==="ready"?"⏳ Wird ausgewertet …":"⏳ Spracherkennung wird geladen (einmalig, etwa 80 MB) …"):"";

function toast(html){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=html;document.body.appendChild(d);setTimeout(()=>d.remove(),2900)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=document.getElementById("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);const cols=["#0f8b8d","#e0457b","#ffc93c","#2f6fd6","#7a4fd6","#1e9b57"];
  const P=Array.from({length:130},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.3,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,s:(Math.random()-.5)*.3}));
  const t0=performance.now();(function f(t){const k=(t-t0)/1700;x.clearRect(0,0,innerWidth,innerHeight);if(k>=1)return;
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.globalAlpha=1-k;x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});requestAnimationFrame(f)})(t0)}
function tilly(mood,size){const mouth=mood==="wow"?'<ellipse cx="48" cy="69" rx="4.5" ry="5.5" fill="#1b2545"/>':mood==="sad"?'<path d="M41 72 Q48 66 55 72" stroke="#1b2545" stroke-width="3.5" fill="none" stroke-linecap="round"/>':'<path d="M40 66 Q48 75 56 66" stroke="#1b2545" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true" style="flex:none"><path d="M38 8q-6 7 0 13t0 13M54 6q-6 7 0 13t0 13" stroke="#9db4c6" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="48" cy="90" rx="42" ry="7" fill="#cfdbe7"/><path d="M76 52h5a11 11 0 0 1 0 22h-8" fill="none" stroke="#b02e5d" stroke-width="7"/><path d="M16 42h64v18a32 27 0 0 1-64 0z" fill="#e0457b"/><rect x="13" y="37" width="70" height="9" rx="4.5" fill="#b02e5d"/><circle cx="38" cy="58" r="5" fill="#1b2545"/><circle cx="58" cy="58" r="5" fill="#1b2545"/><circle cx="39.6" cy="56.3" r="1.6" fill="#fff"/><circle cx="59.6" cy="56.3" r="1.6" fill="#fff"/><circle cx="29" cy="66" r="4.5" fill="#ff9dbd" opacity=".75"/><circle cx="67" cy="66" r="4.5" fill="#ff9dbd" opacity=".75"/>${mouth}</svg>`}

/* ================= Fortschritt, Punkte, Stufen ================= */
function streakNow(){return S.last>=today()-1?S.streak:0}
function gain(n){if(n<=0)return;const t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;S.best=Math.max(S.best,S.streak)}
  S.xp+=n;S.days[t]=(S.days[t]||0)+n;
  if(S.days[t]>=S.goal&&S.goalDay!==t){S.goalDay=t;setTimeout(()=>{toast("🎯 Tagesziel geschafft!");confetti();beep("win")},500)}
  save();checkBadges()}
function grade(id,ok){const c=card(id),t=today();
  if(ok){if(c.box===0||c.due<=t){const b=Math.min(5,c.box+1);S.cards[id]={box:b,due:t+INT[b]}}}else S.cards[id]={box:1,due:t}}
function rate(){const h=S.hist.slice(-20);return h.length<8?null:h.reduce((a,b)=>a+b,0)/h.length}
function lvShare(){const a=ALL.filter(id=>lvOf(id)===S.level);return a.length?a.filter(seen).length/a.length:1}
function record(ok){S.hist.push(ok?1:0);if(S.hist.length>30)S.hist=S.hist.slice(-30);
  if(S.level<MAXLV&&S.hist.length>=20&&rate()>=.85&&lvShare()>=.6){S.level++;S.hist=S.hist.slice(-10);
    setTimeout(()=>{toast(`🚀 Aufgestiegen! Stufe ${S.level}: ${LN[S.level]}`);confetti();beep("win")},700)}save()}
function newCount(){const r=rate();return r===null?6:r<.6?3:r>=.85?8:6}
function tStat(ti){const ids=T[ti].w.map((_,i)=>ti+"."+i),learned=ids.filter(seen).length,due=ids.filter(isDue).length;let stars=0;
  if(learned===ids.length){stars=1;if(ids.reduce((a,id)=>a+card(id).box,0)/ids.length>=2.5)stars=2;if(ids.every(id=>card(id).box>=4))stars=3}
  return{ids,learned,due,total:ids.length,stars}}
function unlocked(ti){const t=T[ti];if(t.lv>S.level)return false;if(ti===0||T[ti-1].lv!==t.lv)return true;
  return tStat(ti-1).learned===T[ti-1].w.length||tStat(ti).learned>0}
function curTopic(){for(let i=0;i<T.length;i++)if(unlocked(i)&&tStat(i).learned<T[i].w.length)return i;return -1}

const BADGES=[
["first","🎉","Erster Schritt","Erste Punkte geholt",()=>S.xp>0],
["s3","🔥","Dranbleiber","3 Tage in Folge",()=>S.best>=3],
["s7","🏅","Eine Woche","7 Tage in Folge",()=>S.best>=7],
["s30","🏆","Ein Monat","30 Tage in Folge",()=>S.best>=30],
["w50","📗","50 Wörter","50 Wörter gelernt",()=>ALL.filter(seen).length>=50],
["w150","📘","150 Wörter","150 Wörter gelernt",()=>ALL.filter(seen).length>=150],
["w300","📕","300 Wörter","300 Wörter gelernt",()=>ALL.filter(seen).length>=300],
["wall","🎓","Wortmeister","Alle Wörter gelernt",()=>ALL.every(seen)],

["r8","📚","Bücherwurm","8 Texte verstanden",()=>Object.keys(S.read).length>=8],
["d1","🗣️","Erstes Gespräch","Ein Gespräch geschafft",()=>Object.keys(S.dlg).length>=1],
["d5","🎭","Gesprächsprofi","5 Gespräche geschafft",()=>Object.keys(S.dlg).length>=5],
["rep","🎤","Gut verstanden","10 Sätze sauber nachgesprochen",()=>S.reps>=10],
["blitz","⚡","Blitzschnell","15 Treffer in der Blitzrunde",()=>S.blitz>=15],

["l4","🌟","Stufe 4","Fortgeschritten erreicht",()=>S.level>=4],

/* ================= Fragen ================= */
function hiRate(){const r=rate();return r!==null&&r>=.85}
function pickType(){const r=rate(),lo=r===null||r<.6;const t=lo?["ende","ende","deen"]:hiRate()?["deen","build","build","ende"]:["ende","deen","build"];if(canSpeak())t.push("listen");
  if(S.level>=3)t.push("gap");if(S.level>=4)t.push("type");if(S.level>=5)t.push("gap","type","type","sent");if(S.level>=6)t.push("sent","sent");return pick(t)}
const ekey=w=>w.replace(/^to /,"").replace(/[.?!]$/,"");
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const norm=x=>x.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function typeOk(target,v){const t=norm(target),x=norm(v);if(!x)return 0;const vars=[t,t.replace(/^to /,""),t.replace(/^(the|a|an) /,"")];
  if(vars.indexOf(x)>=0)return 2;return vars.some(y=>y.length>=5&&lev(y,x)<=1)?1:0}
function mk(id,type){const w=W(id);
  if(type==="build"){const tk=w[2].split(" ");if(tk.length>=3&&tk.length<=(hiRate()?9:7)){let bank;do{bank=shuffle(tk.map((t,i)=>({t,i})))}while(bank.every((b,k)=>b.i===k));return{id,type,bank,picked:[],state:null}}type="ende"}
  if(type==="type"||type==="sent")return{id,type,val:"",state:null};
  let gapS=null;if(type==="gap"){const re=new RegExp("\\b"+reEsc(ekey(w[0]))+"\\b","i");if(re.test(w[2]))gapS=w[2].replace(re,"<span class=\"gapbox\">?</span>");else type="deen"}
  if(type==="listen"&&!canSpeak())type="deen";
  const f=type==="ende"?1:0,ti=tOf(id),same=shuffle(T[ti].w.map((_,i)=>ti+"."+i)),rest=shuffle(ALL.filter(x=>lvOf(x)<=S.level+1)),opts=[id];
  for(const o of same.concat(rest)){if(opts.length>=4)break;if(o!==id&&!opts.some(x=>W(x)[f].toLowerCase()===W(o)[f].toLowerCase()))opts.push(o)}
  return{id,type,opts:shuffle(opts),chosen:null,state:null,gapS}}
function newSes(kind,title,q,extra){stopTimer();hush();ui.act=Object.assign({type:"ses",kind,title,q,pos:0,xp:0,right:0,total:0,combo:0,maxc:0,end:false},extra||{});go();sayItem()}
function startLesson(ti){const s=tStat(ti),fresh=s.ids.filter(id=>!seen(id)).slice(0,newCount());let q=[];
  if(!fresh.length){q=shuffle(s.ids).slice(0,10).map(id=>mk(id,pickType()));newSes("review",T[ti].t,q,{ti});return}
  for(let i=0;i<fresh.length;i+=3){const c=fresh.slice(i,i+3);c.forEach(id=>q.push({id,type:"intro"}));shuffle(c).forEach(id=>q.push(mk(id,"ende")));const lv=T[ti].lv;shuffle(c).forEach(id=>q.push(mk(id,lv>=6?pick(["type","gap","sent"]):lv>=5?pick(["type","gap"]):lv>=3?pick(["gap","deen"]):canSpeak()&&Math.random()<.4?"listen":"deen")))}
  newSes("lesson",T[ti].t,q,{ti})}
function placeQs(lv){const ty=lv>=5?["gap","sent","type","deen","build"]:lv>=3?["gap","deen","type","ende","build"]:["ende","deen","ende","deen","build"];return shuffle(ALL.filter(id=>lvOf(id)===lv)).slice(0,5).map((id,k)=>mk(id,ty[k]))}
function startPlace(){newSes("place","Einstufungstest",placeQs(1),{lv:1,lvRight:0,passed:0,wrong:[]})}
function placeMore(a){if(a.lvRight>=4){a.passed=a.lv;if(a.lv<MAXLV){a.lv++;a.lvRight=0;a.q=a.q.concat(placeQs(a.lv));return true}}return false}
function finishPlace(a){a.end=true;hush();const res=Math.min(MAXLV,a.passed+1),t=today();
  ALL.forEach(id=>{if(lvOf(id)<res&&a.wrong.indexOf(id)<0&&card(id).box<3)S.cards[id]={box:3,due:t+5+Math.floor(Math.random()*26)}});
  a.wrong.forEach(id=>{S.cards[id]={box:1,due:t}});
  a.res=res;S.level=Math.max(S.level,res);S.placed=true;S.hist=[];save();checkBadges();if(res>1){confetti();beep("win")}render()}
function startReview(){const due=shuffle(ALL.filter(isDue)).slice(0,15);if(!due.length){startQuiz();return}newSes("review","Wiederholung",due.map(id=>mk(id,pickType())))}
function startQuiz(){const p=learnedPool(6);newSes("quiz","Gemischtes Quiz",shuffle(p).slice(0,10).map(id=>mk(id,pickType())))}
function blitzItem(){const p=learnedPool(8),w=pick(p);return mk(w,Math.random()<.5?"ende":"deen")}
function startBlitz(){newSes("blitz","Blitzrunde",[blitzItem()],{score:0,deadline:Date.now()+60000});ui.timer=setInterval(tickTimer,200)}
function stopTimer(){if(ui.timer){clearInterval(ui.timer);ui.timer=null}}
function tickTimer(){const a=ui.act;if(!a){stopTimer();return}
  if(a.type==="ses"&&a.kind==="blitz"){const left=Math.max(0,a.deadline-Date.now());const b=document.getElementById("tbar"),l=document.getElementById("tleft");
    if(b)b.style.width=(left/600)+"%";if(l)l.textContent=Math.ceil(left/1000)+" s";if(left<=0)finishSes(a)}
  else if(a.type==="pairs"){const e=document.getElementById("ptime");if(e)e.textContent=fmtTime(Date.now()-a.t0)}}
const fmtTime=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function sayItem(){const a=ui.act;if(!a||a.type!=="ses"||a.end)return;const it=a.q[a.pos];if(!it)return;if(it.type==="intro"||it.type==="listen"||it.type==="ende")speak(W(it.id)[0])}
function resolve(it,ok){const a=ui.act;
  if(a.kind==="place"){it.state=ok?"ok":"no";a.total++;if(ok){a.right++;a.lvRight++}else a.wrong.push(it.id);beep(ok?"ok":"bad");render();return}
  it.state=ok?"ok":"no";a.total++;if(ok){a.right++;a.combo++}else a.combo=0;a.maxc=Math.max(a.maxc,a.combo);
  if(a.maxc>S.bestCombo)S.bestCombo=a.maxc;record(ok);grade(it.id,ok);
  const xp=ok?(a.kind==="blitz"?5:a.combo>=5?15:10):0;a.xp+=xp;gain(xp);beep(ok?"ok":"bad");
  if(a.kind==="blitz"){if(ok)a.score++;render();setTimeout(()=>{if(ui.act===a&&!a.end){a.q.push(blitzItem());a.pos++;render()}},ok?450:1300);return}
  if(!ok&&(a.kind==="lesson"||a.kind==="review"))a.q.push(mk(it.id,"ende"));
  render();if(ok&&canSpeak())speak(it.type==="build"||it.type==="sent"?W(it.id)[2]:W(it.id)[0])}
function finishSes(a){a.end=true;stopTimer();hush();if(a.kind==="blitz"&&a.score>S.blitz){S.blitz=a.score;a.record=true}save();checkBadges();
  const acc=a.total?a.right/a.total:1;if((a.kind!=="blitz"&&acc>=.8)||a.record){confetti();beep("win")}render()}

function startPairs(){stopTimer();hush();ui.act={type:"pairs",round:1,rounds:3,used:[],sel:{},done:[],bad:null,mist:0,t0:Date.now(),end:false};newRound(ui.act);go();ui.timer=setInterval(tickTimer,500)}

  if(r)h+=`<div class="card" style="display:flex;flex-direction:column;gap:.5rem"><p class="verdict" style="color:${r.score>=.8?"var(--ok2)":"var(--bad2)"}">${r.score===1?"Perfekt verstanden!":r.score>=.8?"Fast perfekt!":"Noch nicht ganz."}</p>
    <p class="marks" style="font-size:1.15rem">${r.marks.map(m=>`<span class="${m[1]?"hit":"gap"}">${esc(m[0])}</span>`).join(" ")}</p><p class="small muted">Verstanden wurde: „${esc(r.heard)}“</p></div>
    <div class="btns"><button class="btn" data-a="repAgain">Nochmal</button><button class="btn pri" data-a="rep">Nächster Satz</button></div>`;
  else{if(hasSR())h+=`<div class="center" style="display:flex;flex-direction:column;gap:.5rem;padding:.6rem 0"><button class="mic${ui.listening?" on":""}" data-a="rmic" aria-label="Mikrofon"${ui.thinking?" disabled":""}>${ui.thinking?"⏳":MIC}</button><span class="muted">${sttNote()||"Tippen, sprechen, nochmal tippen"}</span><span class="small muted" id="sttp"></span></div>`;
    h+=`<p class="small muted">${hasSR()?"Oder ins Feld tippen und":"Tippe ins Feld und nutze"} die Mikrofon-Taste der Tastatur${hasSR()?" nutzen":""}:</p><div class="say"><input id="say" type="text" lang="en" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off" placeholder="Hier erscheint dein Satz" value="${esc(a.draft)}" aria-label="Dein Satz"><button class="btn pri" data-a="rcheck">Prüfen</button></div>${hasSR()?"":KBTIP}`}
  return h}

function dres(a,m,res){m.marks=res.marks;m.score=res.score;if(res.score>=.8){beep("ok");if(!m.bonus){m.bonus=true;S.reps++;a.xp+=5;gain(5)}}else beep("bad");render()}
function finishGram(a){a.end=true;hush();const n=a.q.length,st=a.right>=n-1?3:a.right>=n-2?2:a.right>=n/2?1:0;if(st>(S.gram[a.i]||0))S.gram[a.i]=st;a.xp+=st*5;gain(st*5);save();checkBadges();if(st>=2){confetti();beep("win")}render()}
/* ================= Aktionen ================= */
const ACT={
  say(d){speak(d.s)},
  topic(d){startLesson(+d.i)},
  review(){startReview()},quiz(){startQuiz()},blitz(){startBlitz()},pairs(){startPairs()},
  text(d){hush();ui.act={type:"text",i:+d.i,open:{},ans:{},reading:false};go()},
  dlg(d){startDlg(+d.i)},rep(){startRep()},
  exit(){hush();stopTimer();ui.act=null;go()},
  next(){const a=ui.act;a.pos++;if(a.pos>=a.q.length&&!(a.kind==="place"&&placeMore(a))){if(a.kind==="place")finishPlace(a);else finishSes(a);return}render();window.scrollTo(0,0);sayItem()},
  place(){startPlace()},
  rtab(d){ui.readTab=d.v;render()},
  wtext(d){hush();ui.act={type:"wtext",i:+d.i,flip:{},tr:{}};go()},
  wflip(d){const a=ui.act;if(a.flip[d.id])delete a.flip[d.id];else{a.flip[d.id]=true;speak(d.en)}render()},
  wtr(d){const a=ui.act;a.tr[d.k]=!a.tr[d.k];render()},
  wdone(){const a=ui.act;if(!S.wread[a.i]){S.wread[a.i]=true;gain(20);confetti();beep("win");toast("📖 Text geschafft! +20 ⭐")}save();checkBadges();ACT.exit()},
  gram(d){startGram(+d.i)},
  gstart(){ui.act.intro=false;go()},
  gintro(){ui.act.intro=true;ui.act.back=true;go()},
  gopt(d){const a=ui.act,it=a.q[a.pos];if(it.state!==null)return;it.chosen=+d.k;const ok=it.opts[it.chosen]===it.ok;it.state=ok?"ok":"no";record(ok);beep(ok?"ok":"bad");if(ok){a.right++;a.xp+=10;gain(10)}render();if(ok)speak(it.s.replace("___",it.ok))},
  gnext(){const a=ui.act;a.pos++;if(a.pos>=a.q.length)finishGram(a);else{render();window.scrollTo(0,0)}},
  tcheck(){const a=ui.act,it=a.q[a.pos];if(it.state!==null)return;const b=document.getElementById("typ"),v=((b&&b.value)||it.val||"").trim();if(!v)return;it.val=v;if(it.type==="sent"){const c=compare(W(it.id)[2],v),ok=c.score>=.85;it.marks=c.marks.map((m,k)=>m);it.near=ok&&c.score<1;if(!ok)it.marks=c.marks;resolve(it,ok);return}const r=typeOk(W(it.id)[0],v);it.typo=r===1;resolve(it,r>0)},
  noPlace(){S.placed=true;save();render()},
  idk(){const a=ui.act,it=a.q[a.pos];if(it.state!==null)return;resolve(it,false)},
  opt(d){const a=ui.act,it=a.q[a.pos];if(it.state!==null)return;it.chosen=+d.k;resolve(it,it.opts[it.chosen]===it.id)},
  tok(d){const it=ui.act.q[ui.act.pos];if(it.state!==null||it.picked.indexOf(+d.k)>=0)return;it.picked.push(+d.k);render()},
  untok(d){const it=ui.act.q[ui.act.pos];if(it.state!==null)return;it.picked.splice(+d.k,1);render()},
  check(){const it=ui.act.q[ui.act.pos];if(it.picked.length<it.bank.length)return;resolve(it,it.picked.map(k=>it.bank[k].t).join(" ")===W(it.id)[2])},
  pc(d){const a=ui.act;if(a.bad||a.end)return;a.sel[d.s]=d.id;if(d.s==="l")speak(W(d.id)[0]);
    if(a.sel.l&&a.sel.r){if(a.sel.l===a.sel.r){a.done.push(a.sel.l);beep("ok");a.sel={};
        if(a.done.length===a.L.length){if(a.round<a.rounds){render();setTimeout(()=>{if(ui.act===a){a.round++;newRound(a);render()}},450);return}
          a.ms=Date.now()-a.t0;a.end=true;stopTimer();a.xp=30+(a.mist?0:20);gain(a.xp);if(!S.pairs||a.ms<S.pairs)S.pairs=a.ms;if(!a.mist)S.perfect=true;save();checkBadges();confetti();beep("win")}}
      else{a.mist++;a.bad={l:a.sel.l,r:a.sel.r};beep("bad");setTimeout(()=>{if(ui.act===a){a.bad=null;a.sel={};render()}},650)}}
    render()},
  sent(d){const a=ui.act;a.open[d.k]=!a.open[d.k];render()},
  readAll(){ui.act.reading=true;render();readFrom(0)},
  stopRead(){ui.act.reading=false;hush();render()},
  tq(d){const a=ui.act;if(a.ans[d.k]!==undefined)return;const r=R[a.i],ok=+d.j===r.q[d.k][2];a.ans[d.k]=+d.j;record(ok);beep(ok?"ok":"bad");if(ok)gain(10);
    if(r.q.every((q,k)=>a.ans[k]===q[2])){S.read[a.i]=true;save();checkBadges();confetti()}render()},
  dtr(d){ui.act.log[+d.k].show=true;render()},
  dopt(d){const a=ui.act,o=a.opts[+d.k];if(a.answered||a.wrong.indexOf(+d.k)>=0)return;
    if(o.ok){a.answered=true;a.log.push({who:"me",en:o.en,de:o.de});const first=!a.wrong.length;if(first){a.first++;record(true)}const xp=first?10:5;a.xp+=xp;gain(xp);beep("ok");render();window.scrollTo(0,document.body.scrollHeight);speak(o.en)}
    else{a.wrong.push(+d.k);if(a.wrong.length===1)record(false);beep("bad");render()}},
  dsay(){const a=ui.act,m=a.log[a.log.length-1];
    listen(m.en,res=>{if(!res){render();return}dres(a,m,res)})},
  dcheck(){const a=ui.act,m=a.log[a.log.length-1],b=document.getElementById("say"),v=((b&&b.value)||a.draft||"").trim();if(!v)return;a.draft="";dres(a,m,compare(m.en,v))},
  dnext(){const a=ui.act;hush();a.draft="";a.step++;if(a.step>=D[a.i].st.length){a.end=true;S.dlg[a.i]=true;a.xp+=20;gain(20);save();checkBadges();confetti();beep("win");go()}else{setStep(a);render();window.scrollTo(0,document.body.scrollHeight)}},
  rmic(){const a=ui.act;listen(W(a.id)[2],res=>{if(res)repResult(a,res);else render()})},
  rcheck(){const a=ui.act,b=document.getElementById("say"),v=((b&&b.value)||a.draft).trim();if(!v)return;a.draft="";repResult(a,compare(W(a.id)[2],v))},
  repAgain(){const a=ui.act;a.res=null;render();speak(W(a.id)[2])},
  set(d){S[d.k]=d.k==="accent"?d.v:d.k==="sound"?d.v==="true":+d.v;save();render();if(d.k==="accent"||d.k==="rate")speak("Hello! How are you today?")},
  noInstall(){S.noInstall=true;save();render()},
  srOn(){S.srOff=false;save();render()},
  resetAsk(){ui.resetAsk=true;render()},resetNo(){ui.resetAsk=false;render()},
  resetYes(){S=def();save();ui.resetAsk=false;ui.act=null;go()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener("input",e=>{if(!ui.act)return;if(e.target.id==="say")ui.act.draft=e.target.value;else if(e.target.id==="typ"&&ui.act.q)ui.act.q[ui.act.pos].val=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="typ"){e.preventDefault();ACT.tcheck()}
  if(e.key==="Enter"&&e.target.id==="say"){e.preventDefault();if(ui.act&&ui.act.type==="dlg")ACT.dcheck();else ACT.rcheck()}});
window.addEventListener("hashchange",()=>{if(!ui.act)go()});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!inFrame())navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
